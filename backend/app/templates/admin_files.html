<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Admin Files</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #111;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    height: 100vh;
    background: #0f172a;
    color: white;
    position: fixed;
    padding: 20px;
}

.sidebar h2 {
    font-size: 18px;
    margin-bottom: 20px;
}

.sidebar a {
    display: block;
    color: #cbd5e1;
    text-decoration: none;
    margin: 10px 0;
}

.sidebar a:hover {
    color: white;
}

/* MAIN */
.main {
    margin-left: 240px;
    padding: 25px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* FILTERS */
.filters {
    margin: 15px 0;
    display: flex;
    gap: 10px;
}

select, input {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ddd;
}

/* TABLE */
table {
    width: 100%;
    background: white;
    border-collapse: collapse;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #f1f5f9;
}

/* BADGES */
.badge {
    padding: 5px 10px;
    border-radius: 6px;
    color: white;
    font-size: 12px;
    text-transform: capitalize;
}

.low { background: #22c55e; }
.medium { background: #f59e0b; }
.high { background: #ef4444; }

/* BUTTON */
button {
    padding: 6px 10px;
    border: none;
    background: #111;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

button:hover {
    background: #000;
}

/* STATS BAR */
.stats {
    display: flex;
    gap: 15px;
    margin: 20px 0;
}

.card {
    flex: 1;
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.card h3 {
    margin: 0;
    font-size: 20px;
}

small {
    color: #666;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="/admin/files">Files</a>
    <a href="/admin/statistics">Statistics</a>
    <a href="/check">Check text</a>
    <a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">

    <div class="header">
        <h1>All Files</h1>
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="card">
            <h3 id="total">0</h3>
            <small>Total files</small>
        </div>

        <div class="card">
            <h3 id="high">0</h3>
            <small>High plagiarism</small>
        </div>

        <div class="card">
            <h3 id="avg">0%</h3>
            <small>Average similarity</small>
        </div>
    </div>

    <!-- FILTERS -->
    <div class="filters">
        <select id="levelFilter" onchange="renderTable()">
            <option value="all">All levels</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <input id="search" placeholder="Search filename..." oninput="renderTable()">
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>File</th>
                <th>Similarity</th>
                <th>Level</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="table"></tbody>
    </table>

</div>

<script>

const token = localStorage.getItem("token");
if (!token) window.location.href = "/login";

let docs = [];

async function loadFiles() {
    const res = await fetch("/documents/history", {
        headers: { "Authorization": "Bearer " + token }
    });

    docs = await res.json();

    updateStats();
    renderTable();
}

function updateStats() {
    document.getElementById("total").innerText = docs.length;

    const high = docs.filter(d => d.level === "high").length;
    document.getElementById("high").innerText = high;

    const avg = docs.length
        ? (docs.reduce((s, d) => s + d.max_similarity, 0) / docs.length * 100).toFixed(2)
        : 0;

    document.getElementById("avg").innerText = avg + "%";
}

function renderTable() {
    const table = document.getElementById("table");
    table.innerHTML = "";

    const levelFilter = document.getElementById("levelFilter").value;
    const search = document.getElementById("search").value.toLowerCase();

    let filtered = docs;

    if (levelFilter !== "all") {
        filtered = filtered.filter(d => d.level === levelFilter);
    }

    if (search) {
        filtered = filtered.filter(d =>
            d.filename.toLowerCase().includes(search)
        );
    }

    filtered.forEach(doc => {
        table.innerHTML += `
            <tr>
                <td>${doc.id}</td>
                <td>${doc.filename}</td>
                <td>${(doc.max_similarity * 100).toFixed(2)}%</td>
                <td><span class="badge ${doc.level}">${doc.level}</span></td>
                <td>
                    <button onclick="downloadPDF(${doc.id})">PDF</button>
                </td>
            </tr>
        `;
    });
}

function downloadPDF(id) {
    window.open(`/documents/report/${id}`);
}

function logout() {
    localStorage.removeItem("token");
    window.location.href = "/login";
}

loadFiles();

</script>

</body>
</html>
