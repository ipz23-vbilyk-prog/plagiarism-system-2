<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Вхід</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:#eef2f7;

            font-family:Arial, sans-serif;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;
        }

        .login-box{

            width:420px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        h1{

            font-size:56px;

            margin-bottom:35px;

            color:#000;
        }

        input{

            width:100%;

            height:55px;

            margin-bottom:20px;

            border-radius:12px;

            border:1px solid #c9d3e3;

            background:#eaf1fb;

            padding-left:15px;

            font-size:16px;

            outline:none;
        }

        input:focus{

            border:1px solid #2f6fed;
        }

        .login-btn{

            width:100%;

            height:55px;

            border:none;

            border-radius:12px;

            background:#081330;

            color:white;

            font-size:22px;

            cursor:pointer;

            margin-top:10px;
        }

        .login-btn:hover{

            background:#10214f;
        }

        .register-btn{

            width:100%;

            height:55px;

            border:none;

            border-radius:12px;

            background:#2f6fed;

            color:white;

            font-size:22px;

            cursor:pointer;

            margin-top:15px;
        }

        .register-btn:hover{

            background:#2457ba;
        }

        .error{

            color:red;

            margin-top:15px;

            text-align:center;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Вхід</h1>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Пароль"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            Увійти
        </button>

        <button
            class="register-btn"
            onclick="window.location.href='/register'"
        >
            Реєстрація
        </button>

        <div
            id="error"
            class="error"
        ></div>

    </div>

    <script>

        async function login(){

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");

            error.innerText = "";

            try{

                const response = await fetch(

                    "/auth/login",

                    {

                        method:"POST",

                        headers:{
                            "Content-Type":"application/json"
                        },

                        body:JSON.stringify({

                            email:email,
                            password:password

                        })

                    }

                );

                const data = await response.json();

                if(response.ok){

                    localStorage.setItem(
                        "token",
                        data.access_token
                    );

                    window.location.href =
                        "/dashboard";
                }

                else{

                    error.innerText =
                        data.detail || "Помилка входу";
                }

            }

            catch(err){

                error.innerText =
                    "Сервер недоступний";
            }
        }

    </script>

</body>

</html>
