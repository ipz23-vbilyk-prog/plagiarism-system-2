<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Statistics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f6f9;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    height: 100vh;
    background: #111827;
    color: white;
    position: fixed;
    padding: 20px;
}

.sidebar a {
    display: block;
    color: #cbd5e1;
    margin: 10px 0;
    text-decoration: none;
}

.sidebar a:hover {
    color: white;
}

/* MAIN */
.main {
    margin-left: 240px;
    padding: 20px;
}

/* BOX */
.box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

/* TABLE */
table {
    width: 100%;
    background: white;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

/* CANVAS */
canvas {
    background: white;
    border-radius: 10px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Statistics</h2>
    <a href="/admin/files">Files</a>
    <a href="/admin/statistics">Statistics</a>
    <a href="/dashboard">User view</a>
    <a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">

<h1>System analytics</h1>

<div class="box">
    <h3>Plagiarism distribution</h3>
    <canvas id="chart"></canvas>
</div>

<div class="box">
    <h3>All documents</h3>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>File</th>
            <th>Similarity</th>
            <th>Level</th>
        </tr>
        </thead>
        <tbody id="table"></tbody>
    </table>
</div>

</div>

<script>

const token = localStorage.getItem("token");
if (!token) window.location.href = "/login";

/* JWT decode */
function parseJWT(token) {
    try {
        return JSON.parse(atob(token.split(".")[1]));
    } catch {
        return null;
    }
}

const user = parseJWT(token);

/* ROLE GUARD */
if (!user || user.role !== "admin") {
    window.location.href = "/dashboard";
}

let chartInstance = null;

async function loadData() {

    const res = await fetch("/documents/history", {
        headers: { "Authorization": "Bearer " + token }
    });

    const data = await res.json();

    const table = document.getElementById("table");
    table.innerHTML = "";

    let low = 0, medium = 0, high = 0;

    data.forEach(doc => {

        if (doc.level === "low") low++;
        else if (doc.level === "medium") medium++;
        else if (doc.level === "high") high++;

        table.innerHTML += `
            <tr>
                <td>${doc.id}</td>
                <td>${doc.filename}</td>
                <td>${(doc.max_similarity * 100).toFixed(2)}%</td>
                <td>${doc.level}</td>
            </tr>
        `;
    });

    renderChart(low, medium, high);
}

/* FIXED CHART */
function renderChart(low, medium, high) {

    const ctx = document.getElementById("chart");

    if (!ctx) return;

    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: "pie",
        data: {
            labels: ["Low", "Medium", "High"],
            datasets: [{
                data: [low, medium, high]
            }]
        },
        options: {
            responsive: true
        }
    });
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("token");
    window.location.href = "/login";
}

loadData();

</script>

</body>
</html>
