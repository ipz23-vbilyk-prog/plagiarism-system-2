<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<title>
    Панель користувача
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f1f5f9;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{

    width:220px;

    height:100vh;

    background:#0f172a;

    color:white;

    padding:20px;

    position:fixed;

    left:0;

    top:0;
}

.sidebar h2{

    margin-bottom:40px;
}

.sidebar a{

    display:block;

    color:white;

    text-decoration:none;

    margin-bottom:25px;

    font-size:18px;
}

.sidebar a:hover{

    color:#38bdf8;
}

/* =========================
   MAIN
========================= */

.main{

    margin-left:220px;

    width:calc(100% - 220px);

    padding:30px;
}

h1{

    margin-bottom:10px;
}

h2{

    margin-bottom:20px;
}

/* =========================
   SEARCH
========================= */

.search-box{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid #dbeafe;

    margin-bottom:20px;

    font-size:16px;
}

/* =========================
   STATS
========================= */

.stats{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

    margin-bottom:20px;
}

.card{

    background:white;

    border-radius:16px;

    padding:20px;
}

.card-title{

    color:#64748b;

    margin-bottom:10px;
}

.card-value{

    font-size:32px;

    font-weight:bold;
}

/* =========================
   TABLE
========================= */

.table-container{

    background:white;

    border-radius:16px;

    overflow-x:auto;
}

table{

    width:100%;

    border-collapse:collapse;

    table-layout:fixed;
}

th{

    background:#f8fafc;

    text-align:left;

    padding:18px;
}

td{

    padding:18px;

    border-top:1px solid #e2e8f0;

    word-break:break-word;
}

tr:hover{

    background:#f8fafc;
}

/* =========================
   COLUMN WIDTH
========================= */

th:nth-child(1),
td:nth-child(1){

    width:80px;
}

th:nth-child(2),
td:nth-child(2){

    width:45%;
}

th:nth-child(3),
td:nth-child(3){

    width:180px;
}

th:nth-child(4),
td:nth-child(4){

    width:180px;
}

th:nth-child(5),
td:nth-child(5){
    width:150px;
}

th:nth-child(6),
td:nth-child(6){
    width:150px;
}

/* =========================
   BADGES
========================= */

.badge{

    padding:8px 14px;

    border-radius:10px;

    color:white;

    font-weight:bold;

    font-size:14px;
}

.low{
    background:#22c55e;
}

.medium{
    background:#f59e0b;
}

.high{
    background:#ef4444;
}

/* =========================
   PDF BUTTON
========================= */

.pdf-btn{

    background:#2563eb;

    color:white;

    padding:10px 14px;

    border-radius:8px;

    text-decoration:none;

    font-weight:600;

    display:inline-block;
}

.pdf-btn:hover{

    background:#1d4ed8;
}

</style>

</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <h2>
        Панель користувача
    </h2>

    <a href="/dashboard">
        Файли
    </a>

    <a href="/check">
        Перевірка тексту
    </a>

    <a href="#" onclick="logout()">
        Вийти
    </a>

</div>

<!-- =========================
     MAIN
========================= -->

<div class="main">

    <h1>
        Перевірка на плагіат
    </h1>

    <h2>
        Мої документи
    </h2>

    <!-- SEARCH -->

    <input
        type="text"
        id="search"
        class="search-box"
        placeholder="Пошук документа..."
        onkeyup="searchDocuments()"
    >

    <!-- STATS -->

    <div class="stats">

        <div class="card">

            <div class="card-title">
                Всього документів
            </div>

            <div
                class="card-value"
                id="totalDocs"
            >
                0
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                Середня схожість
            </div>

            <div
                class="card-value"
                id="avgSimilarity"
            >
                0%
            </div>

        </div>

    </div>

    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Файл</th>

                    <th>Схожість</th>

                    <th>Рівень</th>

                    <th>PDF</th>

                    <th>Видалити</th>

                </tr>

            </thead>

            <tbody id="documentsTable">

            </tbody>

        </table>

    </div>

</div>

<script>

/* =========================
   AUTH
========================= */

const token =
    localStorage.getItem("token");

if(!token){

    window.location.href =
        "/login";
}

/* =========================
   GLOBAL
========================= */

let allDocuments = [];

/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){

    try{

        const res = await fetch(

            "/documents/history",

            {
                headers:{
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        if(res.status === 401){

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "/login";

            return;
        }

        const data =
            await res.json();

        console.log(data);

        allDocuments = data;

        renderDocuments(data);

    }catch(err){

        console.error(err);

        alert(
            "Помилка завантаження історії"
        );
    }
}

/* =========================
   RENDER DOCUMENTS
========================= */

function renderDocuments(data){

    const table =
        document.getElementById(
            "documentsTable"
        );

    table.innerHTML = "";

    let totalSimilarity = 0;

    data.forEach(doc => {

        /* =========================
           SIMILARITY
        ========================= */

        const similarity =
            Number(
                doc.similarity || 0
            ).toFixed(2);

        totalSimilarity +=
            parseFloat(similarity);

        /* =========================
           LEVEL
        ========================= */

        let levelClass = "low";

        let levelText = "низький";

        if(Number(similarity) >= 30){

            levelClass = "medium";

            levelText = "середній";
        }

        if(Number(similarity) >= 70){

            levelClass = "high";

            levelText = "високий";
        }

        /* =========================
           TABLE ROW
        ========================= */

        table.innerHTML += `

        <tr>

            <td>
                ${doc.id}
            </td>

            <td>
                ${doc.filename}
            </td>

            <td>
                ${similarity}%
            </td>

            <td>

                <span class="
                    badge
                    ${levelClass}
                ">
                    ${levelText}
                </span>

            </td>

           <td>

    <button
        class="pdf-btn"
        onclick="downloadPdf(${doc.id})"
        style="border:none;cursor:pointer;"
    >
        PDF
    </button>

</td>

<td>

    <button
        onclick="deleteDocument(${doc.id})"
        style="
            background:#dc2626;
            color:white;
            border:none;
            padding:10px 14px;
            border-radius:8px;
            cursor:pointer;
        "
    >
        Видалити
    </button>

</td>
        </tr>

        `;
    });

    /* =========================
       TOTAL DOCS
    ========================= */

    document.getElementById(
        "totalDocs"
    ).innerText =
        data.length;

    /* =========================
       AVG SIMILARITY
    ========================= */

    const avg =
        data.length
        ?
        (
            totalSimilarity
            / data.length
        ).toFixed(2)
        :
        0;

    document.getElementById(
        "avgSimilarity"
    ).innerText =
        avg + "%";
}

/* =========================
   SEARCH
========================= */

function searchDocuments(){

    const value =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const filtered =
        allDocuments.filter(doc =>

            doc.filename
            .toLowerCase()
            .includes(value)
        );

    renderDocuments(filtered);
}

/* =========================
   LOGOUT
========================= */


function logout(){

    localStorage.removeItem("token");

    window.location.href = "/login";
}

async function downloadPdf(id){

    const token =
        localStorage.getItem("token");

    try{

        const response = await fetch(

            `/documents/report/${id}`,

            {
                headers:{
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        if(!response.ok){

            alert(
                "Помилка завантаження PDF"
            );

            return;
        }

        const blob =
            await response.blob();

        const url =
            window.URL.createObjectURL(
                blob
            );

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            `report_${id}.pdf`;

        document.body.appendChild(a);

        a.click();

        a.remove();

        window.URL.revokeObjectURL(
            url
        );

    }catch(error){

        console.error(error);

        alert(
            "Помилка завантаження PDF"
        );
    }
}
async function deleteDocument(id){

    if(
        !confirm(
            "Видалити документ?"
        )
    ){
        return;
    }

    const token =
        localStorage.getItem(
            "token"
        );

    try{

        const response =
            await fetch(
                `http://127.0.0.1:8000/documents/delete/${id}`,
                {
                    method: "DELETE",
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        if(!response.ok){
            throw new Error();
        }

        alert(
            "Документ видалено"
        );

        loadHistory();

    }catch(error){

        alert(
            "Помилка видалення"
        );

    }

}

loadHistory();

</script>
</body>
</html>
