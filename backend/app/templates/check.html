```html
<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<title>
Перевірка на плагіат
</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f1f5f9;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{

    width:220px;

    height:100vh;

    background:#0f172a;

    color:white;

    padding:20px;

    position:fixed;

    left:0;

    top:0;
}

.sidebar h2{

    margin-bottom:40px;
}

.sidebar a{

    display:block;

    color:white;

    text-decoration:none;

    margin-bottom:25px;

    font-size:18px;
}

.sidebar a:hover{

    color:#38bdf8;
}

/* =========================
   MAIN
========================= */

.main{

    margin-left:220px;

    width:calc(100% - 220px);

    padding:30px;
}

.container{

    max-width:1200px;

    margin:auto;
}

h1{

    margin-bottom:30px;
}

/* =========================
   UPLOAD
========================= */

.upload-box{

    background:white;

    border:2px dashed #cbd5e1;

    border-radius:20px;

    padding:50px;

    text-align:center;

    margin-bottom:30px;
}

button{

    background:#0f172a;

    color:white;

    border:none;

    padding:14px 30px;

    border-radius:14px;

    font-size:16px;

    cursor:pointer;

    margin-top:20px;
}

button:hover{

    background:#1e293b;
}

/* =========================
   RESULT
========================= */

.result-box{

    background:white;

    border-radius:20px;

    padding:30px;

    margin-top:20px;
}

.match{

    background:#fef2f2;

    border-left:4px solid #ef4444;

    padding:16px;

    margin-top:14px;

    border-radius:12px;
}

.low{

    color:#22c55e;

    font-weight:bold;
}

.medium{

    color:#f59e0b;

    font-weight:bold;
}

.high{

    color:#ef4444;

    font-weight:bold;
}

/* =========================
   CHART
========================= */

.chart-box{

    background:white;

    margin-top:30px;

    padding:30px;

    border-radius:20px;
}

canvas{

    max-width:400px;

    margin:auto;
}

</style>

</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <h2>
        Панель користувача
    </h2>

    <a href="/dashboard">
        Файли
    </a>

    <a href="/check">
        Перевірка тексту
    </a>

    <a href="#" onclick="logout()">
        Вийти
    </a>

</div>

<!-- =========================
     MAIN
========================= -->

<div class="main">

<div class="container">

<h1>
Перевірка на плагіат
</h1>

<!-- =========================
     UPLOAD
========================= -->

<div class="upload-box">

    <h2>
        Перетягніть файл сюди або натисніть для вибору
    </h2>

    <br><br>

    <input
        type="file"
        id="fileInput"
    >

    <br>

    <button onclick="checkFile()">
        Перевірити файл
    </button>

</div>

<!-- =========================
     RESULT
========================= -->

<div
    id="result"
    class="result-box"
    style="display:none;"
></div>

<!-- =========================
     CHART
========================= -->

<div
    id="chartBox"
    class="chart-box"
    style="display:none;"
>

    <h2>
        Аналіз плагіату
    </h2>

    <br>

    <canvas id="chart"></canvas>

</div>

</div>

</div>

<script>

/* =========================
   AUTH
========================= */

const token =
    localStorage.getItem("token");

if(!token){

    window.location.href =
        "/login";
}

/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem(
        "token"
    );

    window.location.href =
        "/login";
}

/* =========================
   CHECK FILE
========================= */

async function checkFile(){

    const file =
        document.getElementById(
            "fileInput"
        ).files[0];

    if(!file){

        alert(
            "Оберіть файл"
        );

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    try{

        /* =====================
           CHECK
        ===================== */

        const response = await fetch(

            "/documents/check",

            {
                method:"POST",

                body:formData,

                headers:{
                    "Authorization":
                    "Bearer " + token
                }
            }
        );

        const data =
            await response.json();

        console.log(data);

        /* =====================
           VALIDATION
        ===================== */

        if(
            data.similarity === undefined
        ){

            alert(
                "Помилка перевірки"
            );

            return;
        }

        /* =====================
           SAVE
        ===================== */

        await fetch(

            "/documents/save",

            {
                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " + token
                },

                body:JSON.stringify({

                    filename:file.name,

                    similarity:data.similarity,

                    level:data.level
                })
            }
        );

        /* =====================
           LEVEL STYLE
        ===================== */

        let levelClass =
            "low";

        if(data.level === "medium"){

            levelClass =
                "medium";
        }

        if(data.level === "high"){

            levelClass =
                "high";
        }

        /* =====================
           MATCHES
        ===================== */

        let matchesHTML = "";

        if(
            data.matches &&
            data.matches.length > 0
        ){

            data.matches.forEach(match => {

                matchesHTML += `

                <div class="match">

                    <b>
                        ${match.source}
                    </b>

                    |
                    ${match.similarity}%

                    <p style="margin-top:10px;">
                        ${match.fragment}
                    </p>

                </div>

                `;
            });

        }else{

            matchesHTML = `

            <div class="match">

                Співпадіння не знайдені

            </div>

            `;
        }

        /* =====================
           RESULT
        ===================== */

        document.getElementById(
            "result"
        ).style.display =
            "block";

        document.getElementById(
            "result"
        ).innerHTML = `

        <h2>
            Результат
        </h2>

        <br>

        <h3>
            Схожість:
            ${data.similarity}%
        </h3>

        <br>

        <h3>

            Рівень:

            <span class="${levelClass}">
                ${data.level}
            </span>

        </h3>

        <br>

        <h3>
            Збіги
        </h3>

        <br>

        ${matchesHTML}

        `;

        /* =====================
           CHART
        ===================== */

        document.getElementById(
            "chartBox"
        ).style.display =
            "block";

        const ctx =
            document.getElementById(
                "chart"
            );

        new Chart(ctx, {

            type:"pie",

            data:{

                labels:[
                    "Плагіат",
                    "Оригінальність"
                ],

                datasets:[{

                    data:[
                        data.similarity,
                        100 - data.similarity
                    ],

                    backgroundColor:[
                        "#ef4444",
                        "#22c55e"
                    ]
                }]
            }
        });

    }catch(error){

        console.error(error);

        alert(
            "Помилка перевірки"
        );
    }
}

</script>

</body>
</html>
```
